# krea2-darask configuration. Copy to config.local.toml for machine-specific overrides (git-ignored).

engine = "native"   # native | fake

[paths]
models_root = "models"            # models/{diffusion_models,text_encoders,vae,loras,upscale_models}
extra_roots = []                  # e.g. ["D:/ComfyUI/models"] - same layout as ComfyUI's models/ directory
outputs = "outputs"
inductor_cache = ".inductor_cache"

[server]
host = "127.0.0.1"                # local-only; anything else is refused at startup
port = 8765
dev_cors = false                  # true only while running `npm run dev` (Vite on :5173)
allowed_hosts = ["127.0.0.1", "localhost"]

[defaults]
transformer = "krea2_turbo_bf16.safetensors"
text_encoder = "Qwen/Qwen3-VL-4B-Instruct"     # HF repo id or a local diffusers/transformers directory under models/text_encoders/
vae = "Qwen/Qwen-Image"                        # HF repo id (subfolder "vae") or local directory under models/vae/
lora_4step = "krea2_turbo_4step_rank_64_lora.safetensors"
upscaler = "4x-UltraSharpV2.safetensors"
preset = "fast_4step"
resolution = "832x1216"

[optimization]
quant = "bf16"                    # bf16 | int8_convrot | fp8_torchao | fp8_comfy_kitchen  (bf16 until bench says otherwise)
attention = ["sdpa"]              # preference order; sage2 / ck_int8_attention are promoted only if available AND compact_text_tokens
compact_text_tokens = false       # drop padded text tokens (mask=None) - required for sage2/sol_attn; verify equivalence on GPU first
compile = false                   # torch.compile via compile_repeated_blocks; auto-off when cl.exe is missing
compile_mode = "max-autotune-no-cudagraphs"
warmup = true
bsa_enabled = true                # Sol-Attention (comfy_kitchen.sol_attn) for >= bsa_min_tokens (hires only in practice)
bsa_tau = 1.3
bsa_start_percent = 0.2
bsa_min_tokens = 12288
nag_enabled = false
text_cache_size = 16
sdpa_disallow_math = true
