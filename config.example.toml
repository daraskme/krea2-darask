[server]
host = "127.0.0.1"
port = 8189
open_browser = true
max_pending_jobs = 8

[paths]
model_root = "models"
transformer_bf16 = "models/diffusion_models/krea2/krea2_turbo_bf16.safetensors"
transformer_int8 = "models/diffusion_models/krea2/krea2_turbo_int8_convrot.safetensors"
raw_int8 = "models/diffusion_models/krea2/krea2_raw_int8_convrot.safetensors"
text_encoder = "models/text_encoders/qwen3vl_4b_bf16.safetensors"
vae = "models/vae/qwen_image_vae.safetensors"
qwen_config = "models/qwen3-vl-4b-instruct"
lora_root = "models/loras/krea2"
upscaler = "models/upscale_models/4x-UltraSharpV2_Lite.safetensors"
# Output directory is selected in the app settings; default: /run/media/hiroshi/ボリューム/生成物

[engine]
default_model = "krea2-turbo-bf16"
attention_backend = "sdpa"
embedding_cache_size = 4
vae_tiling_threshold = 2049

